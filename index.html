<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win11 Web OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap');
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #000000 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; height: 100vh; width: 100vw; overflow: hidden; color: white; user-select: none; }
        
        /* Desktop */
        #desktop { padding: 20px; display: flex; flex-direction: column; gap: 15px; width: 80px; }
        .icon { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .icon:hover { background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .icon img { width: 40px; height: 40px; margin-bottom: 5px; }

        /* Windows */
        .window { position: absolute; top: 10%; left: 20%; width: 800px; height: 550px; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; overflow: hidden; resize: both; min-width: 300px; min-height: 200px; }
        
        /* Title Bar */
        .title-bar { padding: 10px 15px; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: space-between; align-items: center; cursor: grab; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .title-bar:active { cursor: grabbing; }
        .title-text { font-size: 14px; font-weight: 600; }
        .controls { display: flex; gap: 10px; }
        .ctrl-btn { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
        .close { background: #e74c3c; }

        /* Taskbar */
        #taskbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); height: 50px; width: 500px; background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .taskbar-icon { width: 35px; height: 35px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .taskbar-icon:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .taskbar-icon img { width: 24px; height: 24px; }

        .content { flex: 1; overflow: auto; background: #1e1e1e; display: flex; flex-direction: column; }
        .iframe-full { width: 100%; height: 100%; border: none; }

        /* Chat UI */
        .chat-container { display: flex; height: 100%; background: #0a0a0a; }
        .chat-sidebar { width: 250px; background: #111; border-right: 1px solid #333; padding: 15px; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #005c4b; padding: 8px 12px; border-radius: 8px; max-width: 70%; align-self: flex-end; font-size: 14px;}
        .msg.other { background: #202c33; align-self: flex-start; }
        .msg .time { font-size: 10px; color: #aaa; float: right; margin-top: 5px; margin-left: 10px;}
        .chat-input-area { padding: 10px; background: #111; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #2a3942; color: white; outline: none; }
        .chat-input-area button { padding: 10px 20px; border-radius: 20px; border: none; background: #00a884; color: white; cursor: pointer; font-weight: bold;}
        .chat-join { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 15px; }
        .chat-join input { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; text-align: center; letter-spacing: 2px; }
        .chat-join button { padding: 10px 20px; font-size: 16px; border-radius: 6px; border: none; background: #0078d4; color: white; cursor: pointer; }
        
        /* Browser */
        #browserHome { padding: 40px; text-align: center; color: white;}
        #urlInput { width: 60%; padding: 15px; font-size: 16px; border-radius: 30px; border: none; outline: none; background: #333; color: white; margin-top: 20px; }
        .browser-btn { padding: 15px 30px; font-size: 16px; border-radius: 30px; border: none; background: #0078d4; color: white; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="icon" onclick="openApp('proxyApp')"><img src="https://img.icons8.com/color/48/000000/internet-explorer.png"><span>Browser</span></div>
        <div class="icon" onclick="openApp('ytApp')"><img src="https://img.icons8.com/color/48/000000/youtube-play.png"><span>YouTube</span></div>
        <div class="icon" onclick="openApp('ttApp')"><img src="https://img.icons8.com/color/48/000000/tiktok.png"><span>TikTok</span></div>
        <div class="icon" onclick="openApp('chatApp')"><img src="https://img.icons8.com/color/48/000000/whatsapp--v1.png"><span>Chat</span></div>
    </div>

    <!-- Browser -->
    <div id="proxyApp" class="window" style="width: 900px; height: 600px;">
        <div class="title-bar" onmousedown="startDrag(event, 'proxyApp')"><span class="title-text">Web Browser</span><div class="controls"><div class="ctrl-btn close" onclick="closeApp('proxyApp')"></div></div></div>
        <div class="content" style="background: #1e1e1e;">
            <iframe id="browserFrame" class="iframe-full" src="about:blank" style="display:none;"></iframe>
            <div id="browserHome">
                <h2>Search the Web</h2>
                <input type="text" id="urlInput" placeholder="https://en.wikipedia.org" onkeypress="if(event.key==='Enter') navigateBrowser()">
                <button class="browser-btn" onclick="navigateBrowser()">Go</button>
            </div>
        </div>
    </div>

    <!-- YouTube (Piped) -->
    <div id="ytApp" class="window">
        <div class="title-bar" onmousedown="startDrag(event, 'ytApp')"><span class="title-text">YouTube (Piped)</span><div class="controls"><div class="ctrl-btn close" onclick="closeApp('ytApp')"></div></div></div>
        <div class="content"><iframe src="https://piped.video" class="iframe-full"></iframe></div>
    </div>

    <!-- TikTok (ProxiTok) -->
    <div id="ttApp" class="window">
        <div class="title-bar" onmousedown="startDrag(event, 'ttApp')"><span class="title-text">TikTok (ProxiTok)</span><div class="controls"><div class="ctrl-btn close" onclick="closeApp('ttApp')"></div></div></div>
        <div class="content"><iframe src="https://proxitok.pabloferreiro.es" class="iframe-full"></iframe></div>
    </div>

    <!-- Chat -->
    <div id="chatApp" class="window" style="width: 700px; height: 500px;">
        <div class="title-bar" onmousedown="startDrag(event, 'chatApp')"><span class="title-text">Secure Chat</span><div class="controls"><div class="ctrl-btn close" onclick="closeApp('chatApp')"></div></div></div>
        <div class="content">
            <div id="chatJoinScreen" class="chat-join">
                <h2 style="margin:0;">Connect with a Friend</h2>
                <p style="color: #888; font-size: 14px; margin: 0;">Enter a 6-character code to open a room.</p>
                <input type="text" id="roomCodeInput" placeholder="ABC123" maxlength="6" oninput="this.value = this.value.toUpperCase()">
                <button onclick="joinChat()">Connect</button>
            </div>
            <div id="chatActiveScreen" class="chat-container" style="display: none;">
                <div class="chat-sidebar">
                    <div style="font-size: 14px; color: #888;">Room Code:</div>
                    <div id="activeRoomCode" style="font-size: 24px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px;"></div>
                    <button onclick="copyCode()" style="width: 100%; padding: 10px; background: #2a3942; color: white; border: none; border-radius: 6px; cursor: pointer;">Copy Invite Code</button>
                    <button onclick="location.reload()" style="width: 100%; padding: 10px; background: transparent; color: #e74c3c; border: 1px solid #e74c3c; border-radius: 6px; cursor: pointer; margin-top: 10px;">Leave Room</button>
                </div>
                <div class="chat-main">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="taskbar">
        <div class="taskbar-icon" onclick="openApp('proxyApp')"><img src="https://img.icons8.com/color/48/000000/internet-explorer.png"></div>
        <div class="taskbar-icon" onclick="openApp('ytApp')"><img src="https://img.icons8.com/color/48/000000/youtube-play.png"></div>
        <div class="taskbar-icon" onclick="openApp('ttApp')"><img src="https://img.icons8.com/color/48/000000/tiktok.png"></div>
        <div class="taskbar-icon" onclick="openApp('chatApp')"><img src="https://img.icons8.com/color/48/000000/whatsapp--v1.png"></div>
    </div>

    <script>
        let zIndex = 10;
        function openApp(id) { const app = document.getElementById(id); app.style.display = 'flex'; app.style.zIndex = ++zIndex; }
        function closeApp(id) { document.getElementById(id).style.display = 'none'; }
        function startDrag(e, id) {
            const el = document.getElementById(id); const rect = el.getBoundingClientRect();
            const shiftX = e.clientX - rect.left; const shiftY = e.clientY - rect.top;
            el.style.zIndex = ++zIndex;
            function moveAt(pageX, pageY) { el.style.left = pageX - shiftX + 'px'; el.style.top = pageY - shiftY + 'px'; }
            function onMouseMove(e) { moveAt(e.pageX, e.pageY); }
            document.addEventListener('mousemove', onMouseMove);
            document.onmouseup = function() { document.removeEventListener('mousemove', onMouseMove); document.onmouseup = null; };
        }

        function navigateBrowser() {
            const url = document.getElementById('urlInput').value;
            if(!url) return;
            document.getElementById('browserHome').style.display = 'none';
            const frame = document.getElementById('browserFrame');
            frame.style.display = 'block';
            frame.src = '/p/' + encodeURIComponent(url);
        }

        let currentRoom = ""; let currentUser = "User-" + Math.floor(Math.random() * 999); let chatPollInterval = null;
        function joinChat() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if(code.length < 4) return alert("Code must be at least 4 chars");
            currentRoom = code;
            document.getElementById('chatJoinScreen').style.display = 'none';
            document.getElementById('chatActiveScreen').style.display = 'flex';
            document.getElementById('activeRoomCode').innerText = currentRoom;
            fetchMessages(); chatPollInterval = setInterval(fetchMessages, 2000);
        }
        function copyCode() { navigator.clipboard.writeText(currentRoom); alert("Code copied: " + currentRoom); }
        async function fetchMessages() {
            try {
                const res = await fetch('/api/chat/' + currentRoom); const data = await res.json();
                const container = document.getElementById('chatMessages'); container.innerHTML = "";
                data.messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'msg ' + (msg.user === currentUser ? '' : 'other');
                    div.innerHTML = `<div style="font-size:10px;color:#aaa;margin-bottom:2px;">${msg.user}</div>${msg.text}<span class="time">${msg.time}</span>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch(e) {}
        }
        async function sendMessage() {
            const input = document.getElementById('chatInput'); const text = input.value.trim(); if(!text) return;
            input.value = "";
            await fetch('/api/chat/' + currentRoom, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({user: currentUser, text: text}) });
            fetchMessages();
        }
        window.onload = () => openApp('proxyApp');
    </script>
</body>
</html>
